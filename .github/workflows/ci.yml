name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    name: Tests (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Tests only exercise the gesture / state-machine logic and need no
      # webcam or MediaPipe model, so keep the matrix light.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "opencv-python>=4.8.0" "numpy>=1.24.0"

      - name: Run test suite
        run: python tests/run_all.py

  imports:
    name: Full deps resolve + import (py3.11 · ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install everything in requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Importing main pulls in every module (including the MediaPipe
      # tracker) without needing a webcam or the downloaded model.
      - name: Import app modules
        run: python -c "import main, ball, ball_manager, gestures, recorder, hud"